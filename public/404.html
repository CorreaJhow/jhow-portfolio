<!doctype html>
<html lang="pt-BR">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>

        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        background: #09090b;
        color: #f4f4f5;

          ui-sans-serif,
          system-ui,

          sans-serif;

        color: #09090b;

        text-decoration: none;
      }

        background: #6ee7b7;
